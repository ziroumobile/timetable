<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11141b">
<title>行程</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="行程">
<link rel="stylesheet" href="style.css?v=30">
</head>
<body>
<header>
  <div class="menuWrap">
    <button id="btnMenu" class="icon" title="選單" aria-label="選單">☰</button>
    <div id="menuPop" class="menuPop" hidden>
      <button type="button" data-v="week">📅 每週課表</button>
      <button type="button" data-v="month">🗓 行事曆</button>
    </div>
  </div>
  <h1 id="appTitle">行程</h1>
  <div class="spacer"></div>
  <button id="btnTodo" class="icon todoBtn" title="公告 / 待辦事項" aria-label="公告">📋<span id="todoBadge" class="badge" hidden></span></button>
  <button id="btnSettings" class="icon" title="設定">⚙</button>
  <button id="btnAuth" class="chip" hidden>登入</button>
</header>

<section id="monthView" hidden>
  <div class="mHead">
    <button id="mPrev" class="icon" title="上個月">‹</button>
    <b id="mTitle"></b>
    <button id="mNext" class="icon" title="下個月">›</button>
    <div class="spacer"></div>
    <button id="mToday" class="chip">今天</button>
  </div>
  <div id="mDow" class="mGrid dow"></div>
  <div id="mGrid" class="mGrid"></div>
</section>

<main>
  <div class="weekBar"><button id="wPrev" class="icon" title="上一週">‹</button><span id="weekLbl"></span><button id="wNext" class="icon" title="下一週">›</button></div>
  <div id="days" class="days"></div>
  <div id="body" class="body"></div>
</main>

<div class="bar">
  <div class="pill">
    <div id="semTabs" class="tabs" role="tablist"></div>
    <button id="btnSem" class="icon small" title="新增時間表">＋</button>
  </div>
  <button id="btnAdd" class="fab" title="新增名稱">＋</button>
</div>

<!-- 課程 dialog -->
<dialog id="courseDlg">
  <form method="dialog" id="courseForm">
    <h2 id="dlgTitle">新增名稱</h2>
    <label>名稱<input name="name" required maxlength="40"></label>
    <div class="phr" data-f="name"></div>
    <div class="row">
      <label>地點<input name="room" maxlength="30"></label>
    </div>
    <div class="phr" data-f="room"></div>
    <label>備註(選填)<textarea name="note" rows="2" maxlength="300"></textarea></label>
    <div class="swatches" id="swatches"></div>
    <h3>時間</h3>
    <div id="slots"></div>
    <button type="button" id="addSlot" class="link">＋ 新增時段</button>
    <div class="actions">
      <button type="button" id="btnDelete" class="danger">刪除</button>
      <div class="spacer"></div>
      <button type="button" id="btnCancel">取消</button>
      <button type="submit" class="primary">儲存</button>
    </div>
  </form>
</dialog>

<!-- 詳情 dialog -->
<dialog id="infoDlg">
  <div class="info">
    <h2 id="infoName"></h2>
    <h3>地點</h3><p id="infoRoom"></p>
    <div id="infoNoteBox"><h3>備註</h3><p id="infoNote" class="noteText"></p></div>
    <h3>時間</h3><ul id="infoTimes"></ul>
    <h3>總共</h3><p id="infoTotal"></p>
    <div class="actions"><div class="spacer"></div><button type="button" id="btnInfoGhost">隱形這一節</button><button type="button" id="btnInfoEdit">編輯</button><button type="button" id="btnInfoClose" class="primary">關閉</button></div>
  </div>
</dialog>

<!-- 日期簿 dialog -->
<dialog id="sheetDlg">
  <div class="info">
    <h2 id="sheetName"></h2>
    <p class="muted" id="sheetCount"></p>
    <div class="sheetBtns">
      <button type="button" id="btnSheetCopy">複製日期簿</button>
      <button type="button" id="btnSheetLock">🔒 鎖定日期簿</button>
      <button type="button" id="btnSheetClear" class="danger">清除所有行程</button>
    </div>
    <div class="actions"><div class="spacer"></div><button type="button" id="btnSheetClose" class="primary">關閉</button></div>
  </div>
</dialog>

<!-- 新手教學 dialog -->
<dialog id="tutDlg">
  <div class="info">
    <h2 id="tutTitle"></h2>
    <p id="tutBody" class="tutBody"></p>
    <div id="tutDots" class="dots"></div>
    <label class="check"><input type="checkbox" id="tutHide"> 不再顯示</label>
    <div class="actions">
      <button type="button" id="btnTutSkip" class="link">略過</button>
      <div class="spacer"></div>
      <button type="button" id="btnTutPrev">上一頁</button>
      <button type="button" id="btnTutNext" class="primary">下一頁</button>
    </div>
  </div>
</dialog>

<!-- 公告 / 待辦 dialog -->
<dialog id="todoDlg">
  <div class="info">
    <h2>公告 · 待辦事項</h2>
    <form id="todoForm" class="todoAdd">
      <input id="todoText" placeholder="新增待辦事項" maxlength="80" required>
      <div class="dt">
        <input id="todoDate" type="date" aria-label="到期日期(選填)">
        <input id="todoTime" type="text" inputmode="numeric" autocomplete="off" placeholder="24 小時制 1430" maxlength="6" aria-label="到期時間 24 小時制">
      </div>
      <button type="submit" class="primary">新增</button>
    </form>
    <ul id="todoList" class="todoList"></ul>
    <h3>提醒</h3>
    <div class="switchRow"><span>開啟通知</span><label class="switch"><input type="checkbox" id="todoNotifyOn"><span></span></label></div>
    <label>通知時間<select id="todoLead"></select></label>
    <p class="muted" id="todoNote"></p>
    <div class="actions"><div class="spacer"></div><button type="button" id="btnTodoClose" class="primary">關閉</button></div>
  </div>
</dialog>

<!-- 設定 dialog -->
<dialog id="setDlg">
  <form method="dialog">
    <h2>設定</h2>
    <h3>顯示</h3>
    <label class="check"><input type="checkbox" id="optWeekend"> 顯示週六、週日</label>
    <label class="check"><input type="checkbox" id="optSunFirst"> 每週從週日開始(日到六)</label>
    <label>標記的重點時間(小時,逗號分隔)<input id="optKeys" placeholder="7, 12, 18"></label>
    <button type="button" id="btnRest" class="chip">休息時段:關</button>
    <p class="muted">開啟後,沒排行程的空檔會自動標示「休息」。</p>
    <h3>節次</h3>
    <label class="check"><input type="checkbox" id="optPeriod"> 用「第幾節課」顯示與輸入</label>
    <label class="check"><input type="checkbox" id="optNight"> 節次模式顯示 A–D 節(晚間)</label>
    <div id="installBox" hidden>
      <h3>安裝 App</h3>
      <p class="muted" id="installHint">加入主畫面,像 App 一樣使用</p>
      <button type="button" id="btnInstall" class="install">📱 安裝</button>
    </div>
    <h3>教學</h3>
    <button type="button" id="btnTutorial" class="chip">查看新手教學</button>
    <h3>帳號</h3>
    <p class="muted" id="acctInfo"></p>
    <button type="button" id="btnAcct" class="chip">登入</button>
    <div class="actions"><div class="spacer"></div><button class="primary">完成</button></div>
  </form>
</dialog>

<!-- 登入 dialog -->
<dialog id="authDlg">
  <form id="authForm" method="dialog">
    <h2 id="authTitle">登入</h2>
    <p class="muted" id="authHint">登入後行程會同步到雲端,換裝置也看得到。</p>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>密碼<input name="password" type="password" required minlength="6" autocomplete="current-password"></label>
    <p id="authMsg" class="msg"></p>
    <div class="actions">
      <button type="button" id="authToggle" class="link">沒有帳號?註冊</button>
      <div class="spacer"></div>
      <button type="button" id="authCancel">取消</button>
      <button type="submit" class="primary">登入</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=30"></script>
<script src="app.js?v=30"></script>
</body>
</html>
